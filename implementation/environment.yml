name: neurolens
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.2
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - numpy>=1.24
  - scipy>=1.11
  - scikit-learn>=1.3
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - h5py>=3.9
  - tqdm
  - pyyaml
  - pip
  - pip:
    - transformers>=4.40
    - accelerate>=0.27
    - rsatoolbox>=0.1.5
    - nibabel>=5.0
    - nilearn>=0.10
    - pycocotools>=2.0
    - Pillow>=10.0
    - einops
    - safetensors
    - sentencepiece
    - protobuf
    - statsmodels
    - qwen-vl-utils
